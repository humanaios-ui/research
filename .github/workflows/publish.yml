name: publish

on:
  push:
    tags:
      - "paper-*-v*"
      - "dataset-*-v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Create a "production" environment with required reviewers and a
    # deployment tag rule (paper-*, dataset-*) before the first release.
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Tag must point at reviewed main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate publication (Z2 hash, registry, frozen data)
        run: python scripts/validate_repository.py --release "$GITHUB_REF_NAME"

      - name: Inventory is current
        run: python scripts/inventory.py --check

      - name: Build release bundle
        run: python scripts/build_release_manifest.py --tag "$GITHUB_REF_NAME" --out dist --notes-dir notes

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "notes/${GITHUB_REF_NAME}.md" \
            --generate-notes

      # Catalog sync (Supabase) and the Gmail announcement draft run only
      # after this step succeeds, so the catalog never claims a release
      # that failed. Both are designed in docs/ and not yet wired.
