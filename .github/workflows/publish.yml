name: publish

# Tag push publishes. workflow_dispatch with dry_run=true runs every gate and
# builds the bundle for an existing tag, but never attests or creates a release.
on:
  push:
    tags:
      - "paper-*-v*"
      - "dataset-*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rehearse
        required: true
      dry_run:
        description: Skip attestation and GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Night: create a "production" environment with a required human reviewer
    # and a deployment tag rule (paper-*, dataset-*) before the first release.
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # Z2 authority lives in operations (z1-inbox/INDEX.yaml, signed with
      # .z1-control/ratify.py and merged by Z2). Read-only checkout of main.
      - name: Check out operations (Z2 records)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: humanaios-ui/operations
          ref: main
          path: _operations
          # Unset when operations is public: fall back to this run's token.
          token: ${{ secrets.OPERATIONS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install pyyaml==6.0.2

      - name: Tag must point at reviewed main history
        run: git merge-base --is-ancestor "$(git rev-parse "refs/tags/${TAG}^{commit}")" origin/main

      - name: Validate publication (Z2 record, exact commit, exact files, rights)
        run: python scripts/validate_repository.py --release "$TAG" --operations _operations --commit "refs/tags/${TAG}"

      - name: Inventory is current
        run: python scripts/inventory.py --check

      - name: Build release bundle from approved files
        run: python scripts/build_release_manifest.py --tag "$TAG" --operations _operations --commit "refs/tags/${TAG}" --out dist --notes-dir notes

      - name: Verify bundle checksums
        working-directory: dist
        run: sha256sum --check checksums.sha256

      - name: Upload rehearsal bundle
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-${{ env.TAG }}
          path: |
            dist/
            notes/
          retention-days: 7

      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "notes/${TAG}.md" \
            --generate-notes

      # Catalog sync and the announcement draft are not wired. When they are,
      # they run only after this step succeeds.
