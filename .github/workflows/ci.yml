name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository (structure, registry, secrets, frozen paths)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            python scripts/validate_repository.py --base "$BASE_REF"
          else
            python scripts/validate_repository.py
          fi

      - name: Inventory is current
        run: python scripts/inventory.py --check
