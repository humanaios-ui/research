name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pyyaml==6.0.2

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Fail closed: the frozen-path check always runs against an explicit
      # trusted SHA (the PR's base, or the previous main head). If that SHA
      # cannot be resolved, the job fails instead of skipping the check.
      - name: Validate repository (structure, registry, secrets, frozen paths)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "::error::base ${BASE_SHA} not resolvable; refusing to skip the frozen-path check"
            exit 1
          fi
          python scripts/validate_repository.py --base "$BASE_SHA"

      - name: Inventory is current
        run: python scripts/inventory.py --check
